<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReAgent Web UI</title>
<link rel="stylesheet" href="/style.css?v=5">
</head>
<body>
<div class="layout">
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <h1>ReAgent</h1>
      <span class="badge" id="mode-badge">ReAct</span>
    </div>

    <div class="panel">
      <h3>执行模式</h3>
      <div class="mode-switch">
        <button class="mode-btn active" data-mode="react">ReAct</button>
        <button class="mode-btn" data-mode="plan">Plan</button>
      </div>
    </div>

    <div class="panel">
      <h3>工具 <span class="count" id="tool-count">0</span></h3>
      <ul class="cap-list" id="tool-list"></ul>
    </div>

    <div class="panel">
      <h3>子 Agent 档案 <button id="add-agent-btn" class="mini-btn" title="注册新档案">＋</button></h3>
      <ul class="cap-list" id="agent-list"></ul>
      <div class="agent-form" id="agent-form" style="display:none">
        <input type="text" id="agent-name" placeholder="档案名（英文）" class="af-input">
        <input type="text" id="agent-desc" placeholder="职责说明" class="af-input">
        <textarea id="agent-prompt" placeholder="系统提示（人设 + 工作规范）" class="af-input" rows="3"></textarea>
        <input type="text" id="agent-tools" placeholder="工具白名单，逗号分隔（留空=全部）" class="af-input">
        <div class="af-row">
          <button id="agent-save" class="af-btn primary">注册</button>
          <button id="agent-cancel" class="af-btn">取消</button>
        </div>
        <div class="af-error" id="agent-error"></div>
      </div>
    </div>

    <div class="panel">
      <h3>技能 <span class="count" id="skill-count">0</span></h3>
      <ul class="cap-list" id="skill-list"></ul>
    </div>

    <div class="panel">
      <h3>MCP Servers <span class="count" id="mcp-count">0</span></h3>
      <ul class="cap-list" id="mcp-list"></ul>
    </div>

    <div class="panel">
      <h3>会话 <button id="new-session" class="mini-btn" title="新建会话">＋</button></h3>
      <ul class="cap-list" id="session-list"></ul>
    </div>

    <div class="panel">
      <h3>文件 <button id="upload-btn" class="mini-btn" title="上传文件到沙箱">↑</button></h3>
      <ul class="cap-list" id="file-list"></ul>
      <input type="file" id="file-input" style="display:none">
    </div>

    <div class="panel">
      <h3>编排记录 <span class="count" id="orch-count">0</span></h3>
      <ul class="cap-list" id="orch-list"></ul>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebar-scrim" aria-hidden="true"></div>

  <!-- 主区 -->
  <main class="main">
    <header class="chat-header">
      <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-controls="sidebar" aria-expanded="false">☰ 菜单</button>
      <span id="conn-status" class="status-dot"></span>
      <span id="conn-text">连接中...</span>
      <span class="chat-status" id="chat-status" aria-live="polite"></span>
    </header>

    <div class="messages" id="messages">
      <div class="welcome">
        <h2>🤖 ReAgent</h2>
        <p>ReAct / Plan 双模式 · 记忆 · MCP · 技能 · 多 Agent 编排</p>
        <p class="sub">发送后逐步展示 Agent 状态、工具调用与完成后的 Trace</p>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
      <button id="stop" class="stop-btn" type="button" style="display:none" title="停止生成" aria-label="停止生成">■</button>
      <button id="send" class="send-btn">发送</button>
    </div>
  </main>
</div>

<script src="/marked.min.js"></script>
<script src="/app.js?v=5"></script>
</body>
</html>
